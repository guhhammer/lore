[package]
name = "lore-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal list of every command you can type (programs, shell builtins, aliases), grouped A to Z. Linux and macOS; bash, zsh, fish."
license = "MIT"
readme = ".github/README.md"
homepage = "https://lore.guhhammer.dev"
repository = "https://github.com/guhhammer/lore"
keywords = ["terminal", "tui", "commands", "man", "cheatsheet"]
categories = ["command-line-utilities", "development-tools"]
# Only what builds the crate goes into the package, whatever else sits in the
# checkout.
include = ["/src/**", "/build.rs", "/content/**", "/recipes/**", "/tools/**", "/palettes/**", "/beacon/**", "/languages/**", "/devdocs/**", "/i18n/**", "/completions/**", "/man/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/CHANGELOG.md", "/.github/README.md"]
# Not yet: remove this line when the first version is ready for crates.io.
publish = false

[[bin]]
name = "lore"
path = "src/main.rs"

[dependencies]
# `lore --update-pages`: unpacks tldr-pages' zip files (deflate), in pure Rust.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
ratatui = "0.30.2"
ruzstd = "0.8.2"
# The docs topic: DevDocs' index.json and db.json, read when a set is downloaded.
serde_json = "1"
# How many columns a character takes (2 for Chinese, Japanese, Korean). Already
# built as a dependency of ratatui; named here so the text fits by columns.
unicode-width = "0.2"
# The INTERNET section: https requests to cheat.sh, in pure Rust (rustls).
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

# A smaller release binary: the whole program optimised as one unit. Most of
# the size is the built-in pages, which these settings do not touch.
[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
zstd = "0.14.4"

# `cargo deb --target <triple>`: the .deb the release workflow builds. The
# binary is static (musl), so it depends on nothing.
[package.metadata.deb]
name = "lore"
maintainer = "guhhammer (https://github.com/guhhammer/lore)"
copyright = "guhhammer"
section = "utils"
priority = "optional"
extended-description = "Every command you can type, A to Z (programs, shell builtins, aliases), with an offline page for each: what it does, how to use it, what can go wrong."
assets = [
    ["target/release/lore", "usr/bin/", "755"],
    ["man/lore.1", "usr/share/man/man1/", "644"],
    ["completions/lore.bash", "usr/share/bash-completion/completions/lore", "644"],
    ["completions/_lore", "usr/share/zsh/vendor-completions/_lore", "644"],
    ["completions/lore.fish", "usr/share/fish/vendor_completions.d/lore.fish", "644"],
    [".github/README.md", "usr/share/doc/lore/README.md", "644"],
]

# `cargo generate-rpm --target <triple>`: the .rpm, the same files.
[package.metadata.generate-rpm]
name = "lore"
auto-req = "no"
assets = [
    { source = "target/release/lore", dest = "/usr/bin/lore", mode = "755" },
    { source = "man/lore.1", dest = "/usr/share/man/man1/lore.1", mode = "644", doc = true },
    { source = "completions/lore.bash", dest = "/usr/share/bash-completion/completions/lore", mode = "644" },
    { source = "completions/_lore", dest = "/usr/share/zsh/site-functions/_lore", mode = "644" },
    { source = "completions/lore.fish", dest = "/usr/share/fish/vendor_completions.d/lore.fish", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/lore/LICENSE", mode = "644", doc = true },
]
