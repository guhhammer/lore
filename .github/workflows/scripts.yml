name: scripts

# Checks the scripts on every push to main and every pull request that
# touches them: shellcheck on the shell ones (cli/, the release scripts,
# the bash completion, packaging/update.sh), and that every content and
# beacon script is valid Python.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "scripts/**"
      - "completions/**"
      - "packaging/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "cli/**"
      - "scripts/**"
      - "completions/**"
      - "packaging/**"
      - ".github/workflows/scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck cli/make cli/clean scripts/release/*.sh completions/lore.bash packaging/update.sh

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The content scripts parse
        run: |
          python3 -c 'import ast, sys
          for f in sys.argv[1:]:
              ast.parse(open(f).read(), f)' scripts/content/*.py scripts/beacon/*.py scripts/languages/*.py scripts/docs/*.py
